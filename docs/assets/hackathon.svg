<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Built for the Flip the Switch hackathon: WeMakeDevs x DevTools Academy x Switch, Nov 4-7, 2026, Business Workflow track">
